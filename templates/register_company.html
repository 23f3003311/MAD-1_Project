{% extends "base.html" %}

{% block title %}Company Registration{% endblock %}

{% block content %}

<h2>Company Registration</h2>

<form method="POST">
   <input type="text" name="name" required minlength="2" placeholder="Your Name">

    <input type="email" name="email" required placeholder="Email Address">

    <input type="password" name="password" required minlength="6" placeholder="Create Password">

    <input type="text" name="company_name" required minlength="2" placeholder="Company Name">

    <input type="tel" name="hr_contact" required pattern="[0-9]{10}" placeholder="HR Contact (10 digits)">

    <input type="url" name="website" placeholder="Company Website (optional)">

    <textarea name="description" required minlength="10" placeholder="Company Description"></textarea>
    <button type="submit">Register</button>
</form>

<a href="/login" class="back-link">Already registered? Login</a>

{% endblock %}
