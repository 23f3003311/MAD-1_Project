{% extends "base.html" %}
{% block content %}

<h2>Create Placement Drive</h2>

<form method="POST">
    <div class="mb-3">
        <label>Job Title</label>
        <input type="text" name="job_title" required minlength="2" placeholder="Job Title">
    </div>

    <div class="mb-3">
        <label>Description</label>
        <textarea name="job_description" required minlength="10"  rows = "4" placeholder="Job Description"></textarea>
    </div>

    <div class="mb-3">
        <label>Eligibility</label>
        <input type="text" name="eligibility" required minlength="2" placeholder="Eligibility">
    </div>

    <div class="mb-3">
        <label>Application Deadline</label>
        <input type="date" name="deadline" required>
    </div>

    <button type="submit" class="btn btn-primary">Create Drive</button>
</form>

{% endblock %}
