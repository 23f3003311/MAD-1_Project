{% extends "base.html" %}
{% block content %}

<h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">
  <label>Full Name</label>
  <input type="text" name="name" value="{{ current_user.name }}">

  <label>Department</label>
  <input type="text" name="department" value="{{ student.department or '' }}">

  <label>CGPA</label>
  <input type="text" name="cgpa" value="{{ student.cgpa if student.cgpa is not none else '' }}">

  <label>Contact</label>
  <input type="text" name="contact" value="{{ student.contact or '' }}">

  <label>Upload Resume (PDF/DOC/DOCX)</label>
  <input type="file" name="resume">

  {% if student.resume_path %}
    <p>
      Current Resume:
      <a href="{{ url_for('static', filename=student.resume_path) }}" target="_blank">View</a>
    </p>
  {% endif %}

  <button type="submit">Save</button>
</form>

<a class="back-link" href="{{ url_for('student_dashboard') }}">Back to Dashboard</a>

{% endblock %}
